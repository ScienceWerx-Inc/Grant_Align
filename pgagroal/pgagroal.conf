#
# pgagroal pool for local Grant Align development.
#
# Prisma connects to pgagroal on 5433 (DATABASE_URL) and to Postgres directly
# on 5432 (DIRECT_URL). That split is not a local quirk: it is the same shape
# the deployed app uses against Supabase, where the pooled endpoint serves
# queries and migrations must bypass the pooler. Keeping dev identical means a
# migration that would hang in production hangs here first.
#
# Keep this file ASCII-only. pgagroal 2.2.0 rejects a config containing any
# non-ASCII byte with "Configuration file contains binary data or invalid path",
# which looks like a missing file rather than a punctuation problem.
#
[pgagroal]
host = 127.0.0.1
port = 5433
unix_socket_dir = /tmp

# Remote management is off. Turning it on (management = 5434) also requires an
# admin defined via `pgagroal-admin user add` plus a master key, and pgagroal
# refuses every CLI command without one - it just prompts "User name:" forever.
# Not worth the setup for a dev pool; pg_isready on the pool port answers the
# only question this project asks of it.
management = 0

# pgagroal rewrites its own process title once daemonized, so the config path
# disappears from its command line and `pkill -f <config>` silently misses it.
# The pid file is the only reliable handle on the right process.
pidfile = /tmp/pgagroal-grantalign.pid

log_type = file
log_level = info
log_path = /tmp/pgagroal-grantalign.log

# Next dev reloads open a new client on every save. The pool absorbs that
# churn so Postgres never sees more than the handful of connections below.
max_connections = 100
idle_timeout = 600

# Background validation needs a health_check_user to authenticate its probes.
# Without one, pgagroal 2.2.0 on macOS stops accepting new clients after the
# first burst of connection churn (the log shows only "read error errno=54").
# Off is what the other pgagroal setup on this machine uses, and it is fine for
# a local pool talking to a Postgres on the same loopback.
validation = off

[primary]
host = 127.0.0.1
port = 5432
