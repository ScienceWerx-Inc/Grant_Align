# Server-side connections held for this database.
#
# MAX_SIZE must exceed what the client actually opens. Prisma sizes its own
# pool at num_cpus*2+1 (33 on this machine) unless told otherwise, and
# overrunning this limit does not queue - pgagroal stops answering entirely and
# logs only "read error errno=54". DATABASE_URL therefore pins
# connection_limit=5, and this leaves headroom above it for prisma studio,
# psql and the seed script running alongside the dev server.
#
# USER is 'all' rather than 'postgres' because a named user here must also
# exist in pgagroal_users.conf, and INITIAL_SIZE/MIN_SIZE must be 0 for the
# same reason: pre-establishing connections needs stored credentials, which a
# trust-auth local pool does not have.
#
# DATABASE    USER  MAX_SIZE  INITIAL_SIZE  MIN_SIZE
grantalign    all   20        0             0
